name: Sprawdz nowe nabory PSP

on:
  schedule:
    - cron: '0 */12 * * *'   # co 12h
  workflow_dispatch: {}       # pozwala uruchomic recznie z zakladki Actions

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zaleznosci
        run: pip install requests beautifulsoup4

      - name: Uruchom scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Zapisz zmiany
        run: |
          git config user.name "nabory-bot"
          git config user.email "actions@github.com"
          git add data.csv dashboard.html
          git diff --quiet --cached || git commit -m "Aktualizacja naborow [automat]"
          git push
